buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.+'
    }
}

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
}

apply plugin: 'net.minecraftforge.gradle'

version = '1.1'
group = 'com.glennfo.lycaniteskin'

base {
    archivesName = 'lycaniteskin'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                lycaniteskin {
                    source sourceSets.main
                }
            }
        }
    }
}

def lycanitesJar = file('/home/glenn/Documents/curseforge/minecraft/Instances/Sovereign 202 I guess/mods/lycanitesmobs-0.0.9-alpha.jar')

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.10"
    compileOnly files(lycanitesJar)
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'lycaniteskin',
            'Specification-Vendor'    : 'glennfo',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'glennfo',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
